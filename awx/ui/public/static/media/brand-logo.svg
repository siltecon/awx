<?xml version="1.0" encoding="utf-8"?>
<!--
  brand-logo.svg — BundleBuilder general-purpose horizontal logo
  Shield icon + BUNDLEBUILDER wordmark on transparent background.
  Optimized for light backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 80">
  <title>BundleBuilder</title>
  <!-- Shield icon (scaled to ~66px tall, offset 5px top/left) -->
  <g transform="translate(5,5) scale(0.75)">
    <path d="M18,9 Q18,4 23,4 H77 Q82,4 82,9 V57 Q82,84 50,97 Q18,84 18,57 Z"
          fill="#E31837"/>
    <!-- Subtle top highlight -->
    <path d="M27,4 H73 Q82,4 82,9 V20 Q68,14 50,13 Q32,14 18,20 V9 Q18,4 23,4 Z"
          fill="#F04050" opacity="0.4"/>
    <!-- A lettermark -->
    <text x="50" y="71"
          font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
          font-weight="900"
          font-size="52"
          fill="#FFFFFF"
          text-anchor="middle"
          dominant-baseline="auto">B</text>
  </g>
  <!-- BundleBuilder wordmark — dark, bold caps -->
  <text x="80" y="52"
        font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-weight="900"
        font-size="34"
        fill="#1D1D1B"
        letter-spacing="2"
        dominant-baseline="auto">BUNDLEBUILDER</text>
</svg>
