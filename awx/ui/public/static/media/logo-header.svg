<?xml version="1.0" encoding="utf-8"?>
<!--
  logo-header.svg — Armory nav-bar logo
  Designed for dark masthead (PatternFly default ~#1D1D1B).
  Rendered at height:76px, max-width:100px.
  Use a square-ish viewBox so it renders at full height.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <title>Armory</title>
  <!-- Shield icon — WWT red, works on dark background -->
  <path d="M10,8 Q10,4 14,4 H66 Q70,4 70,8 V47 Q70,67 40,77 Q10,67 10,47 Z"
        fill="#E31837"/>
  <!-- Subtle top highlight -->
  <path d="M18,4 H62 Q70,4 70,8 V16 Q56,11 40,10 Q24,11 10,16 V8 Q10,4 14,4 Z"
        fill="#F04050" opacity="0.4"/>
  <!-- A lettermark — white for dark background -->
  <text x="40" y="58"
        font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-weight="900"
        font-size="42"
        fill="#FFFFFF"
        text-anchor="middle"
        dominant-baseline="auto">B</text>
</svg>
