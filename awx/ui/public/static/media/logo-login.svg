<?xml version="1.0" encoding="utf-8"?>
<!--
  logo-login.svg — Armory login-page logo
  Stacked layout: shield icon + ARMORY wordmark + WWT subtitle.
  Max-height 285px in PatternFly login page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200">
  <title>Armory</title>

  <!-- Shield icon — centered, scaled to ~120px tall -->
  <g transform="translate(80,6) scale(1.1)">
    <path d="M18,9 Q18,4 23,4 H77 Q82,4 82,9 V57 Q82,84 50,97 Q18,84 18,57 Z"
          fill="#E31837"/>
    <!-- Top highlight -->
    <path d="M27,4 H73 Q82,4 82,9 V20 Q68,14 50,13 Q32,14 18,20 V9 Q18,4 23,4 Z"
          fill="#F04050" opacity="0.4"/>
    <!-- A lettermark -->
    <text x="50" y="71"
          font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
          font-weight="900"
          font-size="52"
          fill="#FFFFFF"
          text-anchor="middle"
          dominant-baseline="auto">A</text>
  </g>

  <!-- ARMORY wordmark — dark bold caps, centered -->
  <text x="130" y="158"
        font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-weight="900"
        font-size="42"
        fill="#1D1D1B"
        letter-spacing="4"
        text-anchor="middle"
        dominant-baseline="auto">ARMORY</text>

  <!-- WWT subtitle — WWT red, smaller caps -->
  <text x="130" y="181"
        font-family="Arial,'Helvetica Neue',Helvetica,sans-serif"
        font-weight="700"
        font-size="12"
        fill="#E31837"
        letter-spacing="2"
        text-anchor="middle"
        dominant-baseline="auto">WORLD WIDE TECHNOLOGY</text>

  <!-- Thin red rule separating wordmark from subtitle -->
  <line x1="55" y1="166" x2="205" y2="166"
        stroke="#E31837" stroke-width="1.5" opacity="0.4"/>
</svg>
